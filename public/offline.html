<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Al-Rehman Mobile Shop</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #171717;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171717;
          color: #f5f5f5;
        }
      }
      .card {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.7;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        background: #171717;
        color: #ffffff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #f5f5f5;
          color: #171717;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>This page isn't available without an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
